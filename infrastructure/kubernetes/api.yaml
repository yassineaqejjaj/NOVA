apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-api
  labels: {app: nova, component: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: nova, component: api}}
  template:
    metadata: {labels: {app: nova, component: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: nova-backend:0.1.0
          args: ["api"]
          ports: [{containerPort: 8200, name: http}]
          envFrom: [{configMapRef: {name: nova-config}}, {secretRef: {name: nova-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: nova-api
spec:
  selector: {app: nova, component: api}
  ports: [{port: 8200, targetPort: http, name: http}]
