apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova
  annotations:
    # SSE execution streams must not be buffered
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: nova.example.internal
      http:
        paths:
          - {path: /v1/agents, pathType: Prefix, backend: {service: {name: nova-api, port: {number: 8200}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: nova-api, port: {number: 8200}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: nova-web, port: {number: 3000}}}}
