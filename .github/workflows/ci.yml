name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python -m nova.skills.build --check
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL checkpointer, strict checkpoint deserialization)
        run: uv run pytest -q
        env:
          NOVA_DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova_test
          LANGGRAPH_STRICT_MSGPACK: "true"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint
      - run: npm run build -w @nova/web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen && npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results

  images:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t nova-backend:ci .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t nova-web:ci .
      - run: docker build -f infrastructure/railway/keycloak.Dockerfile -t nova-keycloak:ci .
