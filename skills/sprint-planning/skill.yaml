id: sprint-planning
name: Sprint Planning
version: 1.1.0
category: delivery
agent: project
summary: Prepare a sprint proposal from the sprint objective, the backlog, unfinished work and capacity.
purpose: >
  Walk into sprint planning with a realistic proposal: a clear goal, carried-over work made explicit,
  candidate stories prioritized against the goal and checked for dependencies and capacity.
triggers: [sprint planning, prepare sprint, prepare the sprint, plan the sprint, next sprint, sprint proposal, planification de sprint]
inputs:
  - name: sprint
    description: Sprint name or number (e.g. Sprint 19)
  - name: capacity
    description: Team capacity if known (points or person-days)
expected_context:
  orbit_intent: engineering
  query_hint: sprint objective, sprint goal, backlog, previous sprint, unfinished stories, velocity, dependencies, blockers
  source_kinds: null
  token_budget: 6000
  required: true
methodology:
  name: Goal-first sprint planning
  principles:
    - The sprint goal comes first; scope serves the goal
    - Unfinished work is made explicit before new work is added
    - Commit within capacity, keep a small stretch
    - Surface dependencies and risks before the meeting
  references: [Scrum Guide 2020]
steps:
  - id: goal
    title: Reviewing the sprint objective
    instruction: >
      State the proposed sprint goal (from context when available) and the capacity assumption. If capacity
      is unknown, state the assumption explicitly (e.g. based on previous velocity found in context).
    fills: [goal, capacity]
  - id: unfinished
    title: Analyzing unfinished work
    instruction: >
      Identify stories from the previous sprint that are not done and should be carried over (carried_over
      true, status committed or deferred with a reason).
    fills: [carry_over]
  - id: candidates
    title: Prioritizing candidate stories
    instruction: >
      Select candidate stories from the backlog that serve the sprint goal. Put the committed ones within
      capacity and 1–3 stretch items. Each item has an estimate if known and a rationale linking it to the goal.
    fills: [committed, stretch]
  - id: checks
    title: Checking dependencies and risks
    instruction: >
      List dependencies that could block committed items, sprint risks with mitigation, and the questions the
      team must answer during planning.
    fills: [dependencies, risks, questions]
tools: [search_orbit, retrieve_orbit_context, list_artifacts]
outputs:
  artifact_type: sprint_plan
  mode: create
composes_with: [dependency-analysis, risk-analysis, definition-of-ready]
