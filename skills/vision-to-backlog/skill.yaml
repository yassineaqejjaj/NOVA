id: vision-to-backlog
name: Vision to Backlog
version: 1.1.0
category: definition
agent: product
summary: Turn a product vision into objectives, initiatives, epics and user stories with acceptance criteria.
purpose: >
  Bridge strategy and delivery: every story in the backlog traces back to an initiative and an
  objective of the vision, so the team builds what matters first.
triggers: [vision into a backlog, vision to backlog, backlog from the vision, turn the vision, build the backlog, create the backlog]
inputs:
  - name: vision
    description: The product vision or its location (usually found in context)
  - name: horizon
    description: Planning horizon (e.g. next quarter)
expected_context:
  orbit_intent: specification
  query_hint: product vision, objectives, strategy, roadmap, decisions, existing backlog and epics
  token_budget: 6000
  required: true
methodology:
  name: Outcome → initiative → epic → story decomposition
  principles:
    - Objectives describe outcomes; initiatives are bets that move them
    - Epics are shippable increments of value; stories are vertical slices (INVEST)
    - Each story has testable acceptance criteria in Given/When/Then form
    - Keep traceability with parent_id at every level
  references: [Jeff Patton — User Story Mapping, Bill Wake — INVEST]
steps:
  - id: objectives
    title: Deriving objectives from the vision
    instruction: >
      Summarize the vision in 2 sentences and derive 2–4 outcome objectives (with timeframe when known).
    fills: [summary, objectives]
  - id: initiatives
    title: Defining initiatives
    instruction: >
      For each objective, define 1–3 initiatives (bets) with expected impact and confidence. parent_id is the
      objective id.
    fills: [initiatives]
  - id: epics
    title: Creating epics
    instruction: >
      For each initiative, define 1–3 epics (shippable increments) with their value and MoSCoW priority.
      parent_id is the initiative id.
    fills: [epics]
  - id: stories
    title: Writing user stories with acceptance criteria
    instruction: >
      For each epic, write 2–4 user stories (as_a / i_want / so_that) that are vertical slices, each with 2–4
      acceptance criteria (given/when/then). parent_id is the epic id. Priority must/should/could.
    fills: [stories]
  - id: risks
    title: Checking dependencies and risks
    instruction: >
      List cross-epic dependencies, delivery risks with mitigation, and open questions for the team.
    fills: [dependencies, risks, questions]
tools: [search_orbit, retrieve_orbit_context, list_orbit_snapshots, get_orbit_snapshot]
outputs:
  artifact_type: backlog
  mode: create
composes_with: [rice-prioritization, story-mapping, release-planning, sprint-planning]
