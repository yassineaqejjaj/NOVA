criteria:
- key: quality.evidence
  question: Is every issue located and justified?
  weight: 2
- key: quality.a11y
  question: Is accessibility checked?
  weight: 2
checks:
- type: sections_present
  params:
    sections:
    - Issues
    - Recommendations
  description: Core sections are present
- type: citation_required
  params:
    min: 1
  description: Content cites context when context was provided
