criteria:
- key: quality.tokens
  question: Are tokens applied consistently, reusing the Figma variables when provided?
  weight: 2
- key: quality.states
  question: Are empty, loading and error states covered?
  weight: 2
- key: quality.a11y
  question: Do the screens respect WCAG 2.2 AA (contrast, target size, focus)?
  weight: 2
checks:
- type: sections_present
  params:
    sections:
    - Screens
    - Design tokens
  description: Core sections are present
- type: citation_required
  params:
    min: 1
  description: Content cites context when context was provided
