criteria:
- key: quality.ranges
  question: Are estimates ranges with explicit assumptions?
  weight: 2
- key: quality.breakdown
  question: Is the work broken down enough to be estimable?
  weight: 1
checks:
- type: sections_present
  params:
    sections:
    - Work breakdown
    - Total and confidence
  description: Core sections are present
- type: citation_required
  params:
    min: 1
  description: Content cites context when context was provided
