id: wireframes
name: Wireframes
version: 1.0.0
category: definition
agent: design
summary: >-
  Turn NOVA specs or a description into low-detail wireframes: user flow, screen structure and layout, with short placeholder labels.
purpose: >-
  Agree on structure and flow before any visual or copy decision, so feedback focuses on what each screen does.
triggers:
- wireframes
- wireframe
- wireframe this
- screen structure
- layout sketch
- maquette fil de fer
- wireframes de l'écran
inputs:
- name: subject
  description: What to design (feature, flow or screens) and for whom
  required: true
  ask: true
  question: Which feature or flow should be designed, and for whom?
- name: source
  description: >-
    Optional starting point: a NOVA spec Artifact (PRD, user stories, journey, persona, design brief), a Figma URL, or
    a plain description
expected_context:
  orbit_intent: design
  query_hint: PRD, user stories, user journeys, personas, design brief, brand guidelines, design system, accessibility requirements
  token_budget: 6000
methodology:
  name: Structure-first wireframing
  principles:
  - Start from existing specs (PRD, stories, journeys, personas), never from a blank page
  - Structure and hierarchy only, with no color, no final copy and short placeholder labels
  - One primary action per screen
  - Name the states each screen needs, even though only the default is drawn
  references:
  - Nielsen Norman Group — Wireframing
  - Brad Frost — Atomic Design
steps:
- id: sources
  title: Gathering the specs
  instruction: >-
    Find the existing specs with list_artifacts / get_artifact (PRD, user stories, user journeys, personas, design
    brief) and search_orbit / retrieve_orbit_context; if source is a Figma URL, read it with figma_get_design. Write the
    summary and the user flow (one note per step, 4–8 steps).
  fills:
  - summary
  - flows
- id: system
  title: Setting the design foundations
  instruction: >-
    Define a minimal component inventory (components) used by the screens. Tokens are optional: add at most a
    spacing scale and leave color and typography out.
  fills:
  - tokens
  - components
- id: screens
  title: Designing the screens
  instruction: >-
    Create 3–6 screens as screen items, at most 18 elements each, following the element rules in the instructions.
    Set fidelity to wireframe, a device, the purpose, the states list (e.g. empty, loading, error) and a short notes line. If a Figma URL was given, add one figma_ref (status imported). Push to Figma only if the user asks.
  fills:
  - screens
  - figma
tools:
- list_artifacts
- get_artifact
- search_orbit
- retrieve_orbit_context
- figma_get_design
- figma_push_screens
outputs:
  artifact_type: ui_screens
  mode: create
composes_with:
- persona
- user-journey
- design-brief
- lowfi-mockups
- hifi-mockups
- usability-test-plan
